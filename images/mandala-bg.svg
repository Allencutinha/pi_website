<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .petal { fill: none; stroke: #E8521A; stroke-width: 1; opacity: 0.15; }
      .ring { fill: none; stroke: #F4A017; stroke-width: 0.8; opacity: 0.2; }
      .dot { fill: #E8521A; opacity: 0.2; }
    </style>
  </defs>
  <!-- Concentric rings -->
  <circle cx="200" cy="200" r="190" class="ring"/>
  <circle cx="200" cy="200" r="170" class="ring"/>
  <circle cx="200" cy="200" r="150" class="ring"/>
  <circle cx="200" cy="200" r="130" class="ring"/>
  <circle cx="200" cy="200" r="110" class="ring"/>
  <circle cx="200" cy="200" r="90" class="ring"/>
  <circle cx="200" cy="200" r="70" class="ring"/>
  <circle cx="200" cy="200" r="50" class="ring"/>
  <circle cx="200" cy="200" r="30" class="ring"/>
  <!-- Outer petals (16) -->
  <g>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(22.5,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(45,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(67.5,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(90,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(112.5,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(135,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(157.5,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(180,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(202.5,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(225,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(247.5,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(270,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(292.5,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(315,200,200)"/>
    <ellipse cx="200" cy="30" rx="12" ry="30" class="petal" transform="rotate(337.5,200,200)"/>
  </g>
  <!-- Mid petals (12) -->
  <g>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(30,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(60,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(90,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(120,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(150,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(180,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(210,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(240,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(270,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(300,200,200)"/>
    <ellipse cx="200" cy="70" rx="9" ry="22" class="petal" transform="rotate(330,200,200)"/>
  </g>
  <!-- Inner petals (8) -->
  <g>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal"/>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal" transform="rotate(45,200,200)"/>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal" transform="rotate(90,200,200)"/>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal" transform="rotate(135,200,200)"/>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal" transform="rotate(180,200,200)"/>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal" transform="rotate(225,200,200)"/>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal" transform="rotate(270,200,200)"/>
    <ellipse cx="200" cy="118" rx="7" ry="18" class="petal" transform="rotate(315,200,200)"/>
  </g>
  <!-- Decorative dots on rings -->
  <g class="dot">
    <circle cx="200" cy="10" r="3.5"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(30,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(60,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(90,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(120,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(150,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(180,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(210,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(240,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(270,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(300,200,200)"/>
    <circle cx="200" cy="10" r="3.5" transform="rotate(330,200,200)"/>
  </g>
  <!-- Center dot -->
  <circle cx="200" cy="200" r="8" class="dot"/>
  <circle cx="200" cy="200" r="4" fill="#F4A017" opacity="0.3"/>
</svg>
