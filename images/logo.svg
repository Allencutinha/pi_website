<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8521A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4A017;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="97" fill="url(#logoGrad)" />
  <!-- Decorative dots on outer ring -->
  <circle cx="100" cy="5" r="4" fill="#FFF8F0"/>
  <circle cx="165" cy="32" r="4" fill="#FFF8F0"/>
  <circle cx="195" cy="100" r="4" fill="#FFF8F0"/>
  <circle cx="165" cy="168" r="4" fill="#FFF8F0"/>
  <circle cx="100" cy="195" r="4" fill="#FFF8F0"/>
  <circle cx="35" cy="168" r="4" fill="#FFF8F0"/>
  <circle cx="5" cy="100" r="4" fill="#FFF8F0"/>
  <circle cx="35" cy="32" r="4" fill="#FFF8F0"/>
  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="82" fill="#FFF8F0" />
  <!-- Lotus petals (8 petals) -->
  <g fill="none" stroke="#E8521A" stroke-width="1.5" opacity="0.4">
    <ellipse cx="100" cy="65" rx="10" ry="22" />
    <ellipse cx="100" cy="65" rx="10" ry="22" transform="rotate(45,100,100)" />
    <ellipse cx="100" cy="65" rx="10" ry="22" transform="rotate(90,100,100)" />
    <ellipse cx="100" cy="65" rx="10" ry="22" transform="rotate(135,100,100)" />
    <ellipse cx="100" cy="65" rx="10" ry="22" transform="rotate(180,100,100)" />
    <ellipse cx="100" cy="65" rx="10" ry="22" transform="rotate(225,100,100)" />
    <ellipse cx="100" cy="65" rx="10" ry="22" transform="rotate(270,100,100)" />
    <ellipse cx="100" cy="65" rx="10" ry="22" transform="rotate(315,100,100)" />
  </g>
  <!-- Center circle -->
  <circle cx="100" cy="100" r="45" fill="#E8521A" />
  <!-- PI Letters -->
  <text x="100" y="93" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#FFF8F0" letter-spacing="-1">PI</text>
  <!-- Divider line -->
  <line x1="74" y1="100" x2="126" y2="100" stroke="#FFF8F0" stroke-width="1" opacity="0.6"/>
  <!-- e.V. text -->
  <text x="100" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FFF8F0" letter-spacing="3">e.V.</text>
  <!-- Bottom text arc simulation -->
  <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#8B1A1A" letter-spacing="1.5" font-weight="600">PIONEER INDIANS</text>
  <text x="100" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="#5C4033" letter-spacing="2">HANAU · GERMANY</text>
</svg>
