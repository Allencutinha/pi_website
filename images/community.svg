<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="500" height="350" fill="url(#skyGrad)"/>
  <!-- Ground/grass -->
  <ellipse cx="250" cy="380" rx="280" ry="80" fill="url(#grassGrad)"/>
  <!-- Sun -->
  <circle cx="430" cy="60" r="35" fill="#FFC300" opacity="0.9"/>
  <line x1="430" y1="15" x2="430" y2="5" stroke="#FFC300" stroke-width="2.5"/>
  <line x1="430" y1="105" x2="430" y2="115" stroke="#FFC300" stroke-width="2.5"/>
  <line x1="385" y1="60" x2="375" y2="60" stroke="#FFC300" stroke-width="2.5"/>
  <line x1="475" y1="60" x2="485" y2="60" stroke="#FFC300" stroke-width="2.5"/>
  <!-- Buildings in background (Pioneer Park) -->
  <rect x="30" y="130" width="60" height="120" fill="#D4B896" opacity="0.7"/>
  <rect x="28" y="128" width="64" height="6" fill="#B8977A" opacity="0.7"/>
  <rect x="40" y="150" width="15" height="20" fill="#87CEEB" opacity="0.8"/>
  <rect x="65" y="150" width="15" height="20" fill="#87CEEB" opacity="0.8"/>
  <rect x="40" y="180" width="15" height="20" fill="#87CEEB" opacity="0.8"/>
  <rect x="65" y="180" width="15" height="20" fill="#87CEEB" opacity="0.8"/>
  <rect x="50" y="210" width="20" height="40" fill="#A0522D" opacity="0.7"/>

  <rect x="420" y="120" width="70" height="130" fill="#D4B896" opacity="0.7"/>
  <rect x="418" y="118" width="74" height="6" fill="#B8977A" opacity="0.7"/>
  <rect x="430" y="140" width="18" height="22" fill="#87CEEB" opacity="0.8"/>
  <rect x="458" y="140" width="18" height="22" fill="#87CEEB" opacity="0.8"/>
  <rect x="430" y="172" width="18" height="22" fill="#87CEEB" opacity="0.8"/>
  <rect x="458" y="172" width="18" height="22" fill="#87CEEB" opacity="0.8"/>
  <rect x="440" y="205" width="22" height="45" fill="#A0522D" opacity="0.7"/>

  <!-- Trees -->
  <rect x="110" y="200" width="10" height="60" fill="#5C3317"/>
  <ellipse cx="115" cy="190" rx="28" ry="35" fill="#2D6A4F"/>
  <ellipse cx="115" cy="185" rx="20" ry="28" fill="#40916C"/>

  <rect x="370" y="195" width="10" height="65" fill="#5C3317"/>
  <ellipse cx="375" cy="183" rx="30" ry="38" fill="#2D6A4F"/>
  <ellipse cx="375" cy="177" rx="22" ry="30" fill="#40916C"/>

  <!-- People silhouettes -->
  <!-- Person 1 - adult man -->
  <circle cx="180" cy="195" r="16" fill="#8B4513"/>
  <rect x="165" y="211" width="30" height="50" rx="5" fill="#E8521A"/>
  <line x1="165" y1="220" x2="148" y2="250" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <line x1="195" y1="220" x2="212" y2="250" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <line x1="172" y1="261" x2="168" y2="295" stroke="#5C3317" stroke-width="8" stroke-linecap="round"/>
  <line x1="188" y1="261" x2="192" y2="295" stroke="#5C3317" stroke-width="8" stroke-linecap="round"/>

  <!-- Person 2 - woman in saree -->
  <circle cx="240" cy="192" r="15" fill="#D2956E"/>
  <ellipse cx="240" cy="215" rx="14" ry="8" fill="#9B2335"/>
  <path d="M226,215 Q210,240 220,295 L260,295 Q270,240 254,215 Z" fill="#C41E3A"/>
  <path d="M226,215 Q218,230 215,295" fill="none" stroke="#FF69B4" stroke-width="12" opacity="0.6"/>
  <line x1="226" y1="223" x2="210" y2="255" stroke="#D2956E" stroke-width="7" stroke-linecap="round"/>
  <line x1="254" y1="223" x2="270" y2="255" stroke="#D2956E" stroke-width="7" stroke-linecap="round"/>
  <!-- Bindi -->
  <circle cx="240" cy="188" r="2" fill="#FF0000"/>

  <!-- Person 3 - child -->
  <circle cx="300" cy="215" r="12" fill="#8B4513"/>
  <rect x="289" y="227" width="22" height="38" rx="4" fill="#1565C0"/>
  <line x1="289" y1="234" x2="276" y2="258" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
  <line x1="311" y1="234" x2="324" y2="258" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
  <line x1="294" y1="265" x2="291" y2="292" stroke="#5C3317" stroke-width="6" stroke-linecap="round"/>
  <line x1="306" y1="265" x2="309" y2="292" stroke="#5C3317" stroke-width="6" stroke-linecap="round"/>

  <!-- Person 4 - elderly man -->
  <circle cx="345" cy="196" r="15" fill="#C4956A"/>
  <rect x="333" y="211" width="26" height="48" rx="5" fill="#546E7A"/>
  <line x1="333" y1="220" x2="316" y2="252" stroke="#C4956A" stroke-width="7" stroke-linecap="round"/>
  <line x1="359" y1="220" x2="370" y2="260" stroke="#C4956A" stroke-width="5" stroke-linecap="round"/>
  <line x1="338" y1="259" x2="334" y2="292" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>
  <line x1="352" y1="259" x2="356" y2="292" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>
  <!-- Walking stick -->
  <line x1="370" y1="260" x2="374" y2="295" stroke="#5C3317" stroke-width="3" stroke-linecap="round"/>

  <!-- Decorative bunting/flags -->
  <line x1="50" y1="80" x2="450" y2="80" stroke="#888" stroke-width="1.5" stroke-dasharray="none"/>
  <!-- Flags -->
  <polygon points="80,80 100,80 90,100" fill="#FF6B2B"/>
  <polygon points="110,80 130,80 120,100" fill="#FFC300"/>
  <polygon points="140,80 160,80 150,100" fill="#4CAF50"/>
  <polygon points="170,80 190,80 180,100" fill="#E91E63"/>
  <polygon points="200,80 220,80 210,100" fill="#9C27B0"/>
  <polygon points="230,80 250,80 240,100" fill="#FF6B2B"/>
  <polygon points="260,80 280,80 270,100" fill="#FFC300"/>
  <polygon points="290,80 310,80 300,100" fill="#4CAF50"/>
  <polygon points="320,80 340,80 330,100" fill="#E91E63"/>
  <polygon points="350,80 370,80 360,100" fill="#9C27B0"/>
  <polygon points="380,80 400,80 390,100" fill="#FF6B2B"/>
  <polygon points="410,80 430,80 420,100" fill="#FFC300"/>

  <!-- "Pioneer Park" sign -->
  <rect x="200" y="110" width="100" height="28" rx="4" fill="#FFF8F0" stroke="#E8521A" stroke-width="2"/>
  <text x="250" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8521A">Pioneer Park</text>
</svg>
