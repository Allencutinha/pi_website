<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <radialGradient id="nightSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0520;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="flame1" cx="50%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#FFE082"/>
      <stop offset="50%" style="stop-color:#FF8F00"/>
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF8F00;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Night background -->
  <rect width="400" height="260" fill="url(#nightSky)"/>
  <!-- Stars -->
  <circle cx="30" cy="20" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="80" cy="10" r="1" fill="white" opacity="0.7"/>
  <circle cx="140" cy="30" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="200" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="260" cy="25" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="320" cy="8" r="1" fill="white" opacity="0.7"/>
  <circle cx="370" cy="35" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="50" cy="50" r="1" fill="white" opacity="0.5"/>
  <circle cx="300" cy="45" r="1" fill="white" opacity="0.6"/>
  <circle cx="180" cy="55" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="360" cy="60" r="1" fill="white" opacity="0.5"/>
  <circle cx="10" cy="70" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="390" cy="15" r="1" fill="white" opacity="0.6"/>
  <!-- Sparkle stars -->
  <g fill="#FFE082" opacity="0.9">
    <polygon points="100,25 102,32 109,32 103,36 106,43 100,39 94,43 97,36 91,32 98,32" transform="scale(0.5) translate(100,25)"/>
    <polygon points="350,20 352,27 359,27 353,31 356,38 350,34 344,38 347,31 341,27 348,27" transform="scale(0.4) translate(360,22)"/>
    <polygon points="220,40 222,47 229,47 223,51 226,58 220,54 214,58 217,51 211,47 218,47" transform="scale(0.45) translate(210,25)"/>
  </g>
  <!-- Glow effects on ground -->
  <ellipse cx="130" cy="220" rx="50" ry="20" fill="#FF8F00" opacity="0.15"/>
  <ellipse cx="200" cy="220" rx="50" ry="20" fill="#FF8F00" opacity="0.15"/>
  <ellipse cx="270" cy="220" rx="50" ry="20" fill="#FF8F00" opacity="0.15"/>
  <!-- Ground -->
  <rect x="0" y="210" width="400" height="50" fill="#2C1810" opacity="0.8"/>
  <!-- Rangoli pattern on ground -->
  <ellipse cx="200" cy="220" rx="80" ry="12" fill="none" stroke="#FF6B2B" stroke-width="1" opacity="0.4"/>
  <ellipse cx="200" cy="220" rx="60" ry="9" fill="none" stroke="#FFC300" stroke-width="1" opacity="0.4"/>
  <ellipse cx="200" cy="220" rx="40" ry="6" fill="none" stroke="#E91E63" stroke-width="1" opacity="0.3"/>

  <!-- Diya 1 (left) -->
  <g transform="translate(100, 190)">
    <ellipse cx="0" cy="18" rx="28" ry="10" fill="#C55A11" opacity="0.9"/>
    <path d="M-25,15 Q0,5 25,15 Q20,25 0,28 Q-20,25 -25,15Z" fill="#D4580A"/>
    <ellipse cx="0" cy="14" rx="22" ry="7" fill="#E8521A"/>
    <ellipse cx="0" cy="13" rx="16" ry="5" fill="#FF8C42" opacity="0.6"/>
    <!-- Oil pool -->
    <ellipse cx="0" cy="12" rx="10" ry="3" fill="#F4A017" opacity="0.7"/>
    <!-- Wick -->
    <line x1="8" y1="12" x2="12" y2="2" stroke="#5C3317" stroke-width="1.5"/>
    <!-- Flame -->
    <ellipse cx="12" cy="-5" rx="5" ry="10" fill="url(#flame1)" opacity="0.9"/>
    <ellipse cx="12" cy="-2" rx="3" ry="6" fill="#FFE082" opacity="0.8"/>
    <ellipse cx="12" cy="0" rx="2" ry="3" fill="white" opacity="0.9"/>
    <!-- Glow -->
    <ellipse cx="12" cy="-5" rx="15" ry="18" fill="url(#glow1)"/>
  </g>

  <!-- Diya 2 (center) - larger -->
  <g transform="translate(200, 185)">
    <ellipse cx="0" cy="20" rx="35" ry="12" fill="#C55A11" opacity="0.9"/>
    <path d="M-30,17 Q0,5 30,17 Q25,28 0,32 Q-25,28 -30,17Z" fill="#D4580A"/>
    <ellipse cx="0" cy="16" rx="28" ry="9" fill="#E8521A"/>
    <ellipse cx="0" cy="14" rx="20" ry="6" fill="#FF8C42" opacity="0.6"/>
    <ellipse cx="0" cy="13" rx="13" ry="4" fill="#F4A017" opacity="0.7"/>
    <line x1="10" y1="13" x2="14" y2="0" stroke="#5C3317" stroke-width="1.5"/>
    <!-- Bigger flame -->
    <ellipse cx="14" cy="-10" rx="6" ry="14" fill="url(#flame1)" opacity="0.95"/>
    <ellipse cx="14" cy="-6" rx="4" ry="9" fill="#FFE082" opacity="0.85"/>
    <ellipse cx="14" cy="-3" rx="2.5" ry="4" fill="white" opacity="0.9"/>
    <ellipse cx="14" cy="-10" rx="20" ry="25" fill="url(#glow1)"/>
  </g>

  <!-- Diya 3 (right) -->
  <g transform="translate(300, 190)">
    <ellipse cx="0" cy="18" rx="28" ry="10" fill="#C55A11" opacity="0.9"/>
    <path d="M-25,15 Q0,5 25,15 Q20,25 0,28 Q-20,25 -25,15Z" fill="#D4580A"/>
    <ellipse cx="0" cy="14" rx="22" ry="7" fill="#E8521A"/>
    <ellipse cx="0" cy="13" rx="16" ry="5" fill="#FF8C42" opacity="0.6"/>
    <ellipse cx="0" cy="12" rx="10" ry="3" fill="#F4A017" opacity="0.7"/>
    <line x1="8" y1="12" x2="12" y2="2" stroke="#5C3317" stroke-width="1.5"/>
    <ellipse cx="12" cy="-5" rx="5" ry="10" fill="url(#flame1)" opacity="0.9"/>
    <ellipse cx="12" cy="-2" rx="3" ry="6" fill="#FFE082" opacity="0.8"/>
    <ellipse cx="12" cy="0" rx="2" ry="3" fill="white" opacity="0.9"/>
    <ellipse cx="12" cy="-5" rx="15" ry="18" fill="url(#glow1)"/>
  </g>

  <!-- Fireworks -->
  <g opacity="0.85">
    <!-- Firework 1 -->
    <g transform="translate(60,80)" fill="#FF6B2B">
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#FF6B2B" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="17" y2="-12" stroke="#FF6B2B" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#FF6B2B" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="17" y2="12" stroke="#FF6B2B" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FF6B2B" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-17" y2="12" stroke="#FF6B2B" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-20" y2="0" stroke="#FF6B2B" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-17" y2="-12" stroke="#FF6B2B" stroke-width="1.5"/>
      <circle cx="0" cy="-22" r="3" fill="#FFE082"/>
      <circle cx="18" cy="-13" r="2.5" fill="#FFE082"/>
      <circle cx="22" cy="0" r="2.5" fill="#FFE082"/>
      <circle cx="18" cy="13" r="2.5" fill="#FFE082"/>
      <circle cx="0" cy="22" r="3" fill="#FFE082"/>
      <circle cx="-18" cy="13" r="2.5" fill="#FFE082"/>
      <circle cx="-22" cy="0" r="2.5" fill="#FFE082"/>
      <circle cx="-18" cy="-13" r="2.5" fill="#FFE082"/>
    </g>
    <!-- Firework 2 -->
    <g transform="translate(320,55)" fill="#FFC300">
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#FFC300" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="15" y2="-10" stroke="#FFC300" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="18" y2="0" stroke="#FFC300" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="15" y2="10" stroke="#FFC300" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#FFC300" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-15" y2="10" stroke="#FFC300" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-18" y2="0" stroke="#FFC300" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-15" y2="-10" stroke="#FFC300" stroke-width="1.5"/>
      <circle cx="0" cy="-20" r="3" fill="white"/>
      <circle cx="16" cy="-11" r="2.5" fill="white"/>
      <circle cx="20" cy="0" r="2.5" fill="white"/>
      <circle cx="0" cy="20" r="3" fill="white"/>
      <circle cx="-16" cy="-11" r="2.5" fill="white"/>
    </g>
    <!-- Firework 3 -->
    <g transform="translate(200,40)" fill="#E91E63">
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#E91E63" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="14" y2="-8" stroke="#E91E63" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="16" y2="0" stroke="#E91E63" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="14" y2="8" stroke="#E91E63" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#E91E63" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-14" y2="8" stroke="#E91E63" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-16" y2="0" stroke="#E91E63" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-14" y2="-8" stroke="#E91E63" stroke-width="1.5"/>
      <circle cx="0" cy="-18" r="2.5" fill="#FFE082"/>
      <circle cx="15" cy="-9" r="2" fill="#FFE082"/>
      <circle cx="18" cy="0" r="2" fill="#FFE082"/>
      <circle cx="-15" cy="-9" r="2" fill="#FFE082"/>
      <circle cx="-18" cy="0" r="2" fill="#FFE082"/>
    </g>
  </g>
  <!-- Title overlay -->
  <rect x="0" y="0" width="400" height="40" fill="black" opacity="0.3"/>
  <text x="200" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FFE082" letter-spacing="2">DIWALI</text>
</svg>
