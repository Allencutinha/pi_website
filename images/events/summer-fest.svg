<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="summerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5"/>
      <stop offset="100%" style="stop-color:#90CAF9"/>
    </linearGradient>
    <linearGradient id="summerGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="260" fill="url(#summerSky)"/>
  <!-- Sun -->
  <circle cx="360" cy="50" r="38" fill="#FFD600" opacity="0.95"/>
  <circle cx="360" cy="50" r="30" fill="#FFEE58"/>
  <!-- Sun rays -->
  <g stroke="#FFD600" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="360" y1="2" x2="360" y2="-8"/>
    <line x1="360" y1="98" x2="360" y2="108"/>
    <line x1="312" y1="50" x2="302" y2="50"/>
    <line x1="408" y1="50" x2="418" y2="50"/>
    <line x1="326" y1="16" x2="319" y2="9"/>
    <line x1="394" y1="84" x2="401" y2="91"/>
    <line x1="394" y1="16" x2="401" y2="9"/>
    <line x1="326" y1="84" x2="319" y2="91"/>
  </g>
  <!-- Clouds -->
  <g opacity="0.85">
    <ellipse cx="90" cy="40" rx="40" ry="22" fill="white"/>
    <ellipse cx="70" cy="48" rx="30" ry="18" fill="white"/>
    <ellipse cx="115" cy="48" rx="28" ry="16" fill="white"/>
    <ellipse cx="230" cy="30" rx="50" ry="25" fill="white"/>
    <ellipse cx="205" cy="40" rx="35" ry="20" fill="white"/>
    <ellipse cx="258" cy="40" rx="33" ry="18" fill="white"/>
  </g>
  <!-- Grass ground -->
  <rect x="0" y="175" width="400" height="85" fill="url(#summerGrass)"/>
  <!-- Ground texture -->
  <ellipse cx="200" cy="180" rx="200" ry="10" fill="#81C784" opacity="0.3"/>
  <!-- Trees -->
  <rect x="35" y="115" width="12" height="80" fill="#5D4037"/>
  <ellipse cx="41" cy="100" rx="35" ry="45" fill="#2E7D32"/>
  <ellipse cx="41" cy="92" rx="25" ry="35" fill="#43A047"/>
  <ellipse cx="41" cy="85" rx="18" ry="26" fill="#66BB6A"/>

  <rect x="345" y="120" width="12" height="75" fill="#5D4037"/>
  <ellipse cx="351" cy="105" rx="32" ry="42" fill="#2E7D32"/>
  <ellipse cx="351" cy="96" rx="22" ry="32" fill="#43A047"/>
  <ellipse cx="351" cy="89" rx="16" ry="24" fill="#66BB6A"/>
  <!-- Picnic cloth / mat -->
  <ellipse cx="200" cy="210" rx="85" ry="22" fill="#FF7043" opacity="0.8"/>
  <ellipse cx="200" cy="210" rx="80" ry="19" fill="#FFCCBC" opacity="0.6"/>
  <!-- Checkered pattern suggestion -->
  <line x1="130" y1="210" x2="270" y2="210" stroke="#FF7043" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="192" x2="200" y2="228" stroke="#FF7043" stroke-width="1" opacity="0.4"/>
  <!-- Food items on mat -->
  <rect x="180" y="200" width="18" height="12" rx="3" fill="#FFA726" opacity="0.9"/><!-- samosa box -->
  <circle cx="215" cy="204" r="7" fill="#8D6E63" opacity="0.8"/><!-- pot -->
  <ellipse cx="215" cy="200" rx="7" ry="3" fill="#6D4C41" opacity="0.8"/>
  <circle cx="165" cy="207" r="6" fill="#FFCA28" opacity="0.9"/><!-- plate -->
  <!-- Balloon strings -->
  <line x1="150" y1="175" x2="145" y2="230" stroke="#5C3317" stroke-width="1"/>
  <line x1="250" y1="168" x2="248" y2="230" stroke="#5C3317" stroke-width="1"/>
  <line x1="200" y1="160" x2="198" y2="230" stroke="#5C3317" stroke-width="1"/>
  <!-- Balloons -->
  <ellipse cx="150" cy="160" rx="14" ry="18" fill="#F44336" opacity="0.85"/>
  <ellipse cx="250" cy="152" rx="14" ry="18" fill="#2196F3" opacity="0.85"/>
  <ellipse cx="200" cy="144" rx="14" ry="18" fill="#FFEB3B" opacity="0.85"/>
  <ellipse cx="225" cy="158" rx="11" ry="14" fill="#4CAF50" opacity="0.8"/>
  <ellipse cx="175" cy="155" rx="11" ry="14" fill="#9C27B0" opacity="0.8"/>
  <line x1="225" y1="172" x2="222" y2="230" stroke="#5C3317" stroke-width="1"/>
  <line x1="175" y1="169" x2="172" y2="230" stroke="#5C3317" stroke-width="1"/>

  <!-- People sitting/standing -->
  <!-- Adult sitting -->
  <circle cx="148" cy="190" r="11" fill="#8B4513"/>
  <ellipse cx="148" cy="207" rx="14" ry="10" fill="#1565C0"/>
  <!-- Child running -->
  <circle cx="270" cy="185" r="9" fill="#C4956A"/>
  <rect x="263" y="194" width="14" height="28" rx="4" fill="#E91E63"/>
  <line x1="263" y1="200" x2="252" y2="214" stroke="#C4956A" stroke-width="5" stroke-linecap="round"/>
  <line x1="277" y1="200" x2="288" y2="210" stroke="#C4956A" stroke-width="5" stroke-linecap="round"/>
  <line x1="266" y1="222" x2="260" y2="245" stroke="#5C3317" stroke-width="5" stroke-linecap="round"/>
  <line x1="274" y1="222" x2="282" y2="243" stroke="#5C3317" stroke-width="5" stroke-linecap="round"/>

  <!-- Festive flags/bunting -->
  <line x1="30" y1="95" x2="370" y2="95" stroke="#795548" stroke-width="1.5"/>
  <polygon points="65,95 85,95 75,113" fill="#F44336"/>
  <polygon points="100,95 120,95 110,113" fill="#FFEB3B"/>
  <polygon points="135,95 155,95 145,113" fill="#4CAF50"/>
  <polygon points="170,95 190,95 180,113" fill="#2196F3"/>
  <polygon points="205,95 225,95 215,113" fill="#9C27B0"/>
  <polygon points="240,95 260,95 250,113" fill="#FF6B2B"/>
  <polygon points="275,95 295,95 285,113" fill="#F44336"/>
  <polygon points="310,95 330,95 320,113" fill="#FFEB3B"/>

  <!-- Title -->
  <rect x="0" y="0" width="400" height="38" fill="#FF6D00" opacity="0.85"/>
  <text x="200" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="white" letter-spacing="2">SUMMER FESTIVAL</text>
</svg>
