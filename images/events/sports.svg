<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sportsSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9C4"/>
      <stop offset="70%" style="stop-color:#B3E5FC"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="260" fill="url(#sportsSky)"/>
  <!-- Track/field -->
  <ellipse cx="200" cy="230" rx="195" ry="50" fill="#66BB6A" opacity="0.6"/>
  <rect x="0" y="195" width="400" height="65" fill="#A5D6A7"/>
  <!-- Running track markings -->
  <line x1="0" y1="210" x2="400" y2="210" stroke="white" stroke-width="2" stroke-dasharray="15,8"/>
  <line x1="0" y1="225" x2="400" y2="225" stroke="white" stroke-width="2" stroke-dasharray="15,8"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="white" stroke-width="2" stroke-dasharray="15,8"/>
  <!-- Finish line -->
  <rect x="310" y="195" width="6" height="65" fill="white"/>
  <rect x="320" y="195" width="6" height="65" fill="white" opacity="0.6"/>
  <!-- Finish flag -->
  <line x1="316" y1="195" x2="316" y2="150" stroke="#555" stroke-width="2"/>
  <polygon points="316,150 350,160 316,170" fill="#FF6B2B"/>

  <!-- Trophy (center background) -->
  <g transform="translate(185,80)" opacity="0.9">
    <rect x="10" y="55" width="30" height="8" rx="2" fill="#F4A017"/>
    <rect x="5" y="63" width="40" height="5" rx="2" fill="#E8521A"/>
    <path d="M15,0 Q0,5 0,25 Q0,45 15,55 L35,55 Q50,45 50,25 Q50,5 35,0 Z" fill="#FFD600"/>
    <path d="M0,10 Q-12,12 -10,28 Q-8,40 0,40" fill="none" stroke="#FFD600" stroke-width="7" stroke-linecap="round"/>
    <path d="M50,10 Q62,12 60,28 Q58,40 50,40" fill="none" stroke="#FFD600" stroke-width="7" stroke-linecap="round"/>
    <circle cx="25" cy="28" r="10" fill="#FFC300" opacity="0.5"/>
    <text x="25" y="33" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#8B1A1A">1</text>
  </g>

  <!-- Runner 1 - adult woman, leading -->
  <circle cx="270" cy="177" r="12" fill="#C4956A"/>
  <path d="M258,189 Q254,215 258,248 L280,248 Q284,215 282,189 Z" fill="#E91E63"/>
  <!-- Running arms -->
  <line x1="258" y1="197" x2="243" y2="210" stroke="#C4956A" stroke-width="6" stroke-linecap="round"/>
  <line x1="282" y1="197" x2="298" y2="207" stroke="#C4956A" stroke-width="6" stroke-linecap="round"/>
  <!-- Running legs -->
  <line x1="263" y1="248" x2="255" y2="260" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>
  <line x1="273" y1="248" x2="285" y2="257" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>
  <circle cx="270" cy="173" r="2" fill="red"/>

  <!-- Runner 2 - man, behind -->
  <circle cx="180" cy="179" r="13" fill="#8B4513"/>
  <rect x="168" y="192" width="24" height="45" rx="5" fill="#1565C0"/>
  <line x1="168" y1="200" x2="152" y2="213" stroke="#8B4513" stroke-width="7" stroke-linecap="round"/>
  <line x1="192" y1="200" x2="208" y2="210" stroke="#8B4513" stroke-width="7" stroke-linecap="round"/>
  <line x1="173" y1="237" x2="165" y2="258" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>
  <line x1="183" y1="237" x2="193" y2="255" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>

  <!-- Runner 3 - kid, far behind but energetic -->
  <circle cx="90" cy="184" r="10" fill="#D2956E"/>
  <rect x="81" y="194" width="18" height="35" rx="4" fill="#FF6D00"/>
  <!-- Cap -->
  <ellipse cx="90" cy="179" rx="10" ry="6" fill="#FF6D00"/>
  <line x1="81" y1="200" x2="69" y2="212" stroke="#D2956E" stroke-width="5" stroke-linecap="round"/>
  <line x1="99" y1="200" x2="110" y2="208" stroke="#D2956E" stroke-width="5" stroke-linecap="round"/>
  <line x1="84" y1="229" x2="78" y2="250" stroke="#5C3317" stroke-width="6" stroke-linecap="round"/>
  <line x1="93" y1="229" x2="100" y2="248" stroke="#5C3317" stroke-width="6" stroke-linecap="round"/>

  <!-- Tug of war rope in background -->
  <line x1="30" y1="155" x2="200" y2="145" stroke="#8D6E63" stroke-width="5" stroke-linecap="round"/>
  <!-- Tug team markers -->
  <circle cx="25" cy="155" r="8" fill="#E91E63" opacity="0.7"/>
  <circle cx="205" cy="144" r="8" fill="#1565C0" opacity="0.7"/>

  <!-- Spectators banner -->
  <rect x="0" y="0" width="400" height="42" fill="#FF6B2B" opacity="0.9"/>
  <text x="200" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="white" letter-spacing="2">FAMILY SPORTS DAY</text>
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFF8F0" letter-spacing="3">FUN FOR ALL AGES</text>

  <!-- Cheering spectators (small) -->
  <circle cx="340" cy="135" r="8" fill="#8B4513"/>
  <ellipse cx="340" cy="148" rx="10" ry="12" fill="#9C27B0"/>
  <line x1="332" y1="140" x2="322" y2="128" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
  <line x1="348" y1="140" x2="358" y2="128" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>

  <circle cx="365" cy="137" r="8" fill="#C4956A"/>
  <ellipse cx="365" cy="150" rx="10" ry="12" fill="#FF5722"/>
  <line x1="357" y1="142" x2="347" y2="130" stroke="#C4956A" stroke-width="4" stroke-linecap="round"/>
  <line x1="373" y1="142" x2="383" y2="130" stroke="#C4956A" stroke-width="4" stroke-linecap="round"/>
</svg>
