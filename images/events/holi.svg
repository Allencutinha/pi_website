<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <radialGradient id="holiSky" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFF9C4"/>
      <stop offset="100%" style="stop-color:#E0F7FA"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="260" fill="url(#holiSky)"/>
  <!-- Color powder splashes -->
  <!-- Red splash -->
  <ellipse cx="60" cy="120" rx="55" ry="40" fill="#FF1744" opacity="0.7" transform="rotate(-20,60,120)"/>
  <ellipse cx="40" cy="100" rx="35" ry="25" fill="#FF5252" opacity="0.6" transform="rotate(15,40,100)"/>
  <ellipse cx="80" cy="145" rx="25" ry="18" fill="#FF8A80" opacity="0.5"/>
  <!-- Yellow splash -->
  <ellipse cx="340" cy="100" rx="55" ry="38" fill="#FFEA00" opacity="0.7" transform="rotate(20,340,100)"/>
  <ellipse cx="360" cy="125" rx="35" ry="22" fill="#FFD600" opacity="0.6"/>
  <ellipse cx="320" cy="80" rx="28" ry="20" fill="#FFF59D" opacity="0.5"/>
  <!-- Blue splash -->
  <ellipse cx="200" cy="60" rx="65" ry="42" fill="#2196F3" opacity="0.65" transform="rotate(10,200,60)"/>
  <ellipse cx="180" cy="45" rx="40" ry="25" fill="#42A5F5" opacity="0.55"/>
  <ellipse cx="220" cy="80" rx="30" ry="20" fill="#90CAF9" opacity="0.5"/>
  <!-- Green splash -->
  <ellipse cx="110" cy="200" rx="55" ry="35" fill="#00E676" opacity="0.6" transform="rotate(-15,110,200)"/>
  <ellipse cx="85" cy="220" rx="35" ry="22" fill="#69F0AE" opacity="0.5"/>
  <!-- Purple splash -->
  <ellipse cx="290" cy="190" rx="60" ry="38" fill="#E040FB" opacity="0.6" transform="rotate(15,290,190)"/>
  <ellipse cx="315" cy="210" rx="38" ry="24" fill="#EA80FC" opacity="0.5"/>
  <!-- Orange splash -->
  <ellipse cx="200" cy="170" rx="70" ry="45" fill="#FF6D00" opacity="0.5" transform="rotate(-5,200,170)"/>
  <ellipse cx="170" cy="190" rx="40" ry="28" fill="#FF9E40" opacity="0.45"/>
  <!-- Pink splash -->
  <ellipse cx="155" cy="75" rx="45" ry="30" fill="#F50057" opacity="0.55" transform="rotate(25,155,75)"/>

  <!-- Color drops/particles -->
  <circle cx="120" cy="40" r="8" fill="#FF1744" opacity="0.7"/>
  <circle cx="135" cy="55" r="5" fill="#FF5252" opacity="0.6"/>
  <circle cx="105" cy="55" r="6" fill="#FF8A80" opacity="0.5"/>
  <circle cx="330" cy="50" r="7" fill="#FFEA00" opacity="0.7"/>
  <circle cx="350" cy="65" r="5" fill="#FFD600" opacity="0.6"/>
  <circle cx="250" cy="30" r="8" fill="#2196F3" opacity="0.6"/>
  <circle cx="265" cy="45" r="5" fill="#42A5F5" opacity="0.5"/>
  <circle cx="60" cy="170" r="8" fill="#00E676" opacity="0.6"/>
  <circle cx="370" cy="160" r="7" fill="#E040FB" opacity="0.6"/>
  <circle cx="380" cy="178" r="4" fill="#EA80FC" opacity="0.5"/>

  <!-- People throwing colors -->
  <!-- Person 1 (left) -->
  <circle cx="100" cy="175" r="14" fill="#8B4513"/>
  <rect x="87" y="189" width="26" height="42" rx="5" fill="#E91E63"/>
  <line x1="87" y1="197" x2="65" y2="220" stroke="#8B4513" stroke-width="7" stroke-linecap="round"/>
  <line x1="113" y1="197" x2="140" y2="175" stroke="#8B4513" stroke-width="7" stroke-linecap="round"/>
  <!-- Throwing motion - hand with powder -->
  <circle cx="145" cy="170" r="7" fill="#8B4513"/>
  <ellipse cx="160" cy="158" rx="15" ry="10" fill="#2196F3" opacity="0.7" transform="rotate(-30,160,158)"/>
  <line x1="95" y1="231" x2="91" y2="255" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>
  <line x1="107" y1="231" x2="111" y2="255" stroke="#5C3317" stroke-width="7" stroke-linecap="round"/>

  <!-- Person 2 (right) -->
  <circle cx="300" cy="172" r="14" fill="#D2956E"/>
  <path d="M286,186 Q280,210 285,255 L315,255 Q320,210 314,186 Z" fill="#FF6D00"/>
  <path d="M286,186 Q278,205 275,255" fill="none" stroke="#FFCC02" stroke-width="10" opacity="0.5"/>
  <line x1="286" y1="194" x2="258" y2="175" stroke="#D2956E" stroke-width="7" stroke-linecap="round"/>
  <line x1="314" y1="194" x2="336" y2="220" stroke="#D2956E" stroke-width="7" stroke-linecap="round"/>
  <!-- Throwing motion -->
  <circle cx="254" cy="172" r="7" fill="#D2956E"/>
  <ellipse cx="238" cy="162" rx="15" ry="10" fill="#FF1744" opacity="0.7" transform="rotate(25,238,162)"/>
  <circle cx="300" cy="168" r="2" fill="red"/>

  <!-- Child in middle -->
  <circle cx="200" cy="185" r="11" fill="#C4956A"/>
  <rect x="191" y="196" width="18" height="35" rx="4" fill="#9C27B0"/>
  <line x1="191" y1="202" x2="178" y2="220" stroke="#C4956A" stroke-width="6" stroke-linecap="round"/>
  <line x1="209" y1="202" x2="222" y2="215" stroke="#C4956A" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="228" cy="208" rx="12" ry="8" fill="#FFEA00" opacity="0.7" transform="rotate(-20,228,208)"/>
  <line x1="196" y1="231" x2="194" y2="252" stroke="#5C3317" stroke-width="6" stroke-linecap="round"/>
  <line x1="205" y1="231" x2="207" y2="252" stroke="#5C3317" stroke-width="6" stroke-linecap="round"/>

  <!-- Holi text banner -->
  <rect x="0" y="0" width="400" height="40" fill="white" opacity="0.4"/>
  <text x="200" y="27" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#E91E63" letter-spacing="3">HOLI</text>
  <text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#5C3317" letter-spacing="4">FESTIVAL OF COLORS</text>
</svg>
