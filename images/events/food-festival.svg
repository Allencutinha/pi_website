<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="260" fill="url(#foodBg)"/>
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="60" fill="#795548" opacity="0.3"/>

  <!-- Food stall canopy -->
  <!-- Left stall -->
  <rect x="10" y="80" width="150" height="120" rx="3" fill="#FAFAFA" stroke="#E8521A" stroke-width="2"/>
  <!-- Canopy -->
  <polygon points="0,80 170,80 160,55 10,55" fill="#E8521A"/>
  <polygon points="0,80 170,80 160,55 10,55" fill="none" stroke="#C62828" stroke-width="1" stroke-dasharray="15,8"/>
  <!-- Canopy scallops -->
  <path d="M0,80 Q10,68 20,80 Q30,68 40,80 Q50,68 60,80 Q70,68 80,80 Q90,68 100,80 Q110,68 120,80 Q130,68 140,80 Q150,68 160,80 Q165,68 170,80" fill="#FF6B2B"/>
  <!-- Stall counter -->
  <rect x="10" y="165" width="150" height="20" rx="2" fill="#8D6E63"/>
  <!-- Pots on counter -->
  <ellipse cx="40" cy="155" rx="18" ry="12" fill="#5D4037"/>
  <ellipse cx="40" cy="148" rx="18" ry="6" fill="#795548"/>
  <ellipse cx="40" cy="146" rx="14" ry="4" fill="#3E2723"/>
  <!-- Steam from pot -->
  <path d="M33,140 Q30,130 35,120" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M40,138 Q38,126 42,115" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M47,140 Q50,130 45,120" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <ellipse cx="90" cy="155" rx="18" ry="12" fill="#6D4C41"/>
  <ellipse cx="90" cy="148" rx="18" ry="6" fill="#795548"/>
  <ellipse cx="90" cy="146" rx="14" ry="4" fill="#4E342E"/>
  <path d="M83,140 Q80,130 85,120" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M90,138 Q88,127 92,116" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Right stall -->
  <rect x="240" y="80" width="150" height="120" rx="3" fill="#FAFAFA" stroke="#FFC300" stroke-width="2"/>
  <!-- Canopy -->
  <polygon points="230,80 400,80 390,55 240,55" fill="#FFC300"/>
  <path d="M230,80 Q240,68 250,80 Q260,68 270,80 Q280,68 290,80 Q300,68 310,80 Q320,68 330,80 Q340,68 350,80 Q360,68 370,80 Q380,68 390,80 Q395,68 400,80" fill="#FFD600"/>
  <!-- Counter -->
  <rect x="240" y="165" width="150" height="20" rx="2" fill="#8D6E63"/>
  <!-- Food items on right stall -->
  <!-- Samosas on tray -->
  <ellipse cx="275" cy="158" rx="22" ry="8" fill="#D4A017"/>
  <polygon points="258,158 275,140 292,158" fill="#C8860A"/>
  <polygon points="262,158 270,148 278,158" fill="#E8A020"/>
  <polygon points="272,158 280,148 288,158" fill="#E8A020"/>
  <!-- Chaat/snack bowl -->
  <ellipse cx="330" cy="160" rx="18" ry="8" fill="#8D6E63"/>
  <ellipse cx="330" cy="155" rx="18" ry="7" fill="#A0522D"/>
  <ellipse cx="330" cy="153" rx="15" ry="5" fill="#FFF176" opacity="0.8"/>
  <!-- Green chutney drizzle -->
  <path d="M320,153 Q325,148 335,153" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <!-- Tamarind -->
  <path d="M322,155 Q330,151 338,155" fill="none" stroke="#8D4600" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center decoration: Flower rangoli / banner -->
  <!-- String lights between stalls -->
  <path d="M160,60 Q200,75 240,60" fill="none" stroke="#5C3317" stroke-width="1.5"/>
  <circle cx="165" cy="62" r="4" fill="#F44336"/>
  <circle cx="175" cy="66" r="4" fill="#FFEB3B"/>
  <circle cx="185" cy="69" r="4" fill="#4CAF50"/>
  <circle cx="195" cy="72" r="4" fill="#2196F3"/>
  <circle cx="205" cy="73" r="4" fill="#E91E63"/>
  <circle cx="215" cy="71" r="4" fill="#FF6B2B"/>
  <circle cx="225" cy="67" r="4" fill="#9C27B0"/>
  <circle cx="235" cy="63" r="4" fill="#F44336"/>

  <!-- Center serving area -->
  <rect x="165" y="100" width="70" height="80" rx="5" fill="white" opacity="0.8" stroke="#E8521A" stroke-width="1.5"/>
  <!-- Naan bread -->
  <ellipse cx="200" cy="130" rx="25" ry="15" fill="#D4A017" opacity="0.9"/>
  <ellipse cx="200" cy="130" rx="20" ry="11" fill="#E8B84B" opacity="0.8"/>
  <!-- Black sesame dots -->
  <circle cx="193" cy="128" r="1.5" fill="#3E2723"/>
  <circle cx="200" cy="125" r="1.5" fill="#3E2723"/>
  <circle cx="207" cy="130" r="1.5" fill="#3E2723"/>
  <!-- Curry bowl -->
  <ellipse cx="200" cy="155" rx="18" ry="7" fill="#8D6E63"/>
  <ellipse cx="200" cy="151" rx="18" ry="6" fill="#FF6D00" opacity="0.8"/>
  <ellipse cx="200" cy="149" rx="14" ry="4" fill="#FFA726" opacity="0.9"/>

  <!-- Vendor (woman) at left stall -->
  <circle cx="80" cy="135" r="10" fill="#8B4513"/>
  <path d="M70,145 Q66,168 70,198 L90,198 Q94,168 90,145 Z" fill="#E91E63"/>
  <path d="M70,145 Q62,158 60,198" fill="none" stroke="#FF80AB" stroke-width="8" opacity="0.5"/>
  <line x1="70" y1="152" x2="55" y2="162" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="152" x2="108" y2="148" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
  <!-- Ladle in hand -->
  <line x1="108" y1="148" x2="118" y2="138" stroke="#8D6E63" stroke-width="3"/>
  <circle cx="119" cy="136" r="5" fill="#8D6E63"/>
  <circle cx="80" cy="132" r="1.5" fill="red"/>

  <!-- Vendor at right stall -->
  <circle cx="310" cy="135" r="10" fill="#C4956A"/>
  <rect x="300" y="145" width="20" height="42" rx="4" fill="#1565C0"/>
  <line x1="300" y1="152" x2="286" y2="162" stroke="#C4956A" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="152" x2="336" y2="148" stroke="#C4956A" stroke-width="6" stroke-linecap="round"/>

  <!-- Customer with plate -->
  <circle cx="205" cy="178" r="9" fill="#D2956E"/>
  <rect x="197" y="187" width="16" height="30" rx="3" fill="#9C27B0"/>
  <line x1="197" y1="193" x2="185" y2="202" stroke="#D2956E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="184" cy="204" r="7" fill="#FFF9C4"/><!-- plate -->
  <circle cx="207" cy="176" r="1.5" fill="red"/>
  <line x1="213" y1="193" x2="225" y2="200" stroke="#D2956E" stroke-width="5" stroke-linecap="round"/>

  <!-- Title banner -->
  <rect x="0" y="0" width="400" height="40" fill="#8B1A1A" opacity="0.92"/>
  <text x="200" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#FFC300" letter-spacing="2">INDIAN STREET FOOD</text>
  <text x="200" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#FF6B2B" letter-spacing="3">FESTIVAL</text>
</svg>
